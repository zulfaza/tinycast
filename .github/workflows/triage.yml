name: Triage

# pull_request_target so forked PRs get the comment too; safe, as it is API calls only.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v8
        with:
          script: |
            const body = [
              "Thanks for opening this.",
              "",
              "A few things worth knowing up front:",
              "",
              "**Tinycast aims to stay small and focused**, so it is extremely selective about new",
              "features. Every request is read, and the ideas that truly matter are the ones taken on.",
              "Smaller conveniences are usually closed.",
              "",
              "> [!WARNING]",
              "> **Don't write code for this yet.** This issue has to be labelled `approved` first.",
              ">",
              "> 1. Wait for a maintainer to add the `approved` label. That label is the only green light —",
              ">    a reply, a reaction or silence is not one.",
              "> 2. Once it's there, open your pull request with `Closes #" + context.issue.number + "` in the description.",
              ">",
              "> Docs-only changes (`*.md`, `docs/`, `website/`) need no approval.",
              "",
              "Thanks for opening this! A maintainer will take a look soon.",
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Comment on pull request
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thanks for the PR! A maintainer will review it soon."
            });
